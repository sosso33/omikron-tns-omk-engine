<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420"><rect width="100%" height="100%" fill="white"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker></defs><text x="390" y="26" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1d1f">The port: one engine, reference and live backends behind one boundary</text><rect x="20" y="50" width="740" height="50" rx="6" fill="#f2f2f4" stroke="#1d1d1f" stroke-width="1.3"/><text x="390" y="79.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1d1f">frontends:  omk-play (SDL: macOS/Linux, Tiger on PowerPC)   -   the PS Vita build   -   200 probes in engine/tools</text><rect x="20" y="120" width="740" height="90" rx="6" fill="#e9f6ec" stroke="#1d1d1f" stroke-width="1.3"/><text x="390" y="153" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1d1f">the engine  (engine/src, C++20, no required dependency)</text><text x="390" y="169.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">formats/  script/ (Session, VM, zones, dialogue, scenes)  actor/ (.CTL, walker, crowd, fight, shoot)</text><text x="390" y="185.4" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">o3de/ (buckets, texture cache, depth tie, particles)  ui/  audio/  input/  platform/ (DataFs)</text><rect x="20" y="230" width="740" height="40" rx="6" fill="#fff" stroke="#1d1d1f" stroke-width="1.3"/><text x="390" y="254.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1d1f">the renderer boundary - DECISIONS, not API calls:  begin(view)  submit(draw)  end()</text><rect x="20" y="290" width="175" height="70" rx="6" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="107.5" y="313" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1d1f">software rasterizer</text><text x="107.5" y="329.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">the REFERENCE</text><text x="107.5" y="345.4" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">what the checks measure</text><rect x="208" y="290" width="175" height="70" rx="6" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="295.5" y="321.1" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1d1f">Vulkan (MoltenVK)</text><text x="295.5" y="337.3" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">live, desktop</text><rect x="396" y="290" width="175" height="70" rx="6" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="483.5" y="313" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1d1f">GLES2</text><text x="483.5" y="329.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">live, the Vita</text><text x="483.5" y="345.4" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">poses bodies in its shader</text><rect x="585" y="290" width="175" height="70" rx="6" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="672.5" y="313" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1d1f">OpenGL 1.x</text><text x="672.5" y="329.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">fixed function</text><text x="672.5" y="345.4" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">a 1999 Mac, on PowerPC</text><line x1="107" y1="270" x2="107" y2="288" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#ar)"/><line x1="295" y1="270" x2="295" y2="288" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#ar)"/><line x1="483" y1="270" x2="483" y2="288" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#ar)"/><line x1="672" y1="270" x2="672" y2="288" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#ar)"/><line x1="390" y1="100" x2="390" y2="118" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#ar)"/><line x1="390" y1="210" x2="390" y2="228" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#ar)"/><text x="390" y="395" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d1d1f" font-style="italic">the same shape for sound (PCM buffers vs a device) and input (a replayable stream vs a pad)</text></svg>