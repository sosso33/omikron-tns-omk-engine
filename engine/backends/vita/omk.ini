; =============================================================================
[Options]
; THIS PORT'S section, for the two option rows the engine's ini has no key for
; (they are menu-only in the original).

; row 6 - "Niveau d'activite dans les rues", 0..4. Walkers are spaced
; 39 x (5 - level) along each lane, so 4 is the DENSEST street (200 walkers
; in Anekbah). The engine's own default is 3.
streetactivity = 4
; row 7 - level of detail, 0..2. 2 is the most detail: every shadow bone
; (arms, head, legs, chest).
levelofdetail = 2

; =============================================================================
[Enhancements]
; What the original NEVER had - all off by default, because the replica draws
; what the game drew unless told otherwise. Every one is at its top here.
;
; !! ON THE VITA (and in omk-play-gles) READ THIS BEFORE USING THE SECTION !!
; Since 2026-10-05 the GLES2 backend draws the GPU enhancements too
; (todo/enhancements.md, "On the GLES backend"), so every key below now COSTS
; on a console. What vitaGL cannot do is refused at start-up, with a log line:
;   antialiasing  -> refused (vitaGL multisamples only the display, not the
;                    world's render target) - supersampling is the Vita's AA
;   anisotropy    -> refused (vitaGL grants 1x)
; and the rest is drawn: trilinear (a mip chain at load), supersampling (at 4
; the world is drawn at 3840x2176 - a factor the console cannot hold is halved,
; and said), per-pixel lighting and mapped shadows. The new shader programs are
; not in the VPK's precompiled cache; without libshacccg.suprx each enhancement
; that needs one is refused rather than drawn. NONE of this has run on a
; console yet - for a playable frame rate start from supersampling = 1.
; clipdistance = unlimited also costs CPU on a Vita (every set piece and body
; in the area is considered, not only the near ones).

; `all = max` is a BASE: each key below, when present, still wins over it.
all = max

; MSAA samples: 1 (off), 2, 4, 8 - Vulkan and desktop GL; refused on the Vita
antialiasing = 8
; bilinear (the DEFAULT: the original on a 3D card) | nearest (its software
; devices, POINT) | trilinear (a mip chain: the enhancement)
texturefiltering = trilinear
; 1..16 - with trilinear; refused on the Vita (vitaGL grants 1x)
anisotropy = 16
; 1 (off) .. 4: render N times larger each way and resolve - heavy on a Vita
supersampling = 4
; classic (the original's bone blobs) | fitted (blobs on the ground) |
; mapped (a real shadow map from the set's strongest light)
shadowquality = mapped
; pervertex (the original: the crowd alone, per vertex) | perpixel (every
; character, per pixel)
lighting = perpixel
; 0 / unlimited: no draw-distance cap (and so no fog) | capped: the
; [Preferences] distance
clipdistance = unlimited
; the interface's scaling filter: nearest (the original) | linear
uiscaling = linear
; shoot mode's minimap: game (only when a script turns it on) | always
radar = always

; ---- for the Vita: keep the game's own lighting and shadows ----
; lighting = pervertex
; shadowquality = classic
