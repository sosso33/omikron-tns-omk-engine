; OMK - the game's config file, every parameter, EVERY ENHANCEMENT AT ITS TOP.
;
; On the PS Vita: copy to ux0:data/omk/omk.ini (backends/vita/vita_main.cpp
; passes it as --config when it exists). On a desktop: omk-play ... --config omk.ini
;
; Read by platform/options.cpp + platform/settings.cpp. Comments start with ; or
; #; section and key names are case-insensitive, as the Win32 profile API was.
;
; ORDER OF PRECEDENCE, lowest first: the engine's defaults, THIS FILE, then the
; options stored in a SAVE FILE (its 3496-byte header carries every option row,
; so loading a save - `--save`, or `--slot` - OVERRIDES [Preferences] and
; [Options] here, exactly as in the original), then a flag on the command line
; (on the Vita: a line in ux0:data/omk/args.txt). [Enhancements] is this port's
; alone and no save carries it, so it always applies.

; =============================================================================
[Preferences]
; The engine's own section. It reads 65 keys (listed in full below); this port
; consumes the 11 that set an option the game has. Values are the menu's.

; row 3 - draw distance in METRES, one of 25 / 50 / 100 / 150 / 200 (default 50).
; [Enhancements] clipdistance below lifts the cap entirely.
clipdistance = 200
; row 4 - the sky (default 1)
displaysky = 1
; row 5 - the character shadows (default 1). With it off, no shadow draws
; whatever [Enhancements] shadowquality says.
displayshadows = 1
; row 2 - the display mode (default 640 x 480). The Vita's own main passes
; --res 640x480, which wins; the frame is scaled into the 960x544 screen.
screen_x = 640
screen_y = 480
; rows 23 / 24 - mouse sensitivity (defaults 20 / 15). No mouse on a Vita.
MouseSensX = 20
MouseSensY = 15
; rows 10 / 11 / 12 - the volumes are ATTENUATIONS: 0 is full, 100 is silent
; (the engine's own sense; `Music_SetVolume` sums them). Defaults 0.
music = 0
DialogAttenuation = 0
FxAttenuation = 0

; ---- the engine's other keys: real key names out of the binary's DATA
; section, which this port does NOT read (debug switches, developer paths,
; the setup dialog's choices). Listed so the file is complete; setting them
; changes nothing here.
; AmbientAttenuation =
; FlagNoCD =
; GFXCard =
; SoftwareMode =
; add_perso1 =        (to add_perso10: developer test characters)
; autocameraplayer =
; camera_free =
; collidescale =
; confirm_exit =
; ctlinfos =
; debug_graph_info =
; debug_maps =
; debug_script_info =
; debug_sound =
; debug_text_info =
; debug_zones =
; default_animbank =
; default_background =
; default_character =
; default_passersbank =
; default_passerspath =
; default_scx =
; default_sfx =
; default_sfxscx =
; disable_fight_ai =
; disable_fight_damages =
; disablebodymotion =
; display_colliding_faces =
; display_doors =
; display_nearestperso =
; display_path =
; display_zone =
; displaycameracone =
; displaycodecount =
; displayfightcol =
; displayframerate =
