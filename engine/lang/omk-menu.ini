; ---------------------------------------------------------------------------
; omk-menu.ini - the texts of OMK's own menu rows, in French and in English.
;
; The game's rows take their texts from the shipped `IAM\Options`, which is in
; the language of the copy installed - and nothing in the data or the exe
; says WHICH language that is. So OMK's additions (`todo/graphics-menu.md`)
; carry their own texts, here, and the config file picks one:
;
;     [OMK]
;     language = fr        ; fr (the default) or en
;
; A missing key in the chosen language falls back to [fr]; a key missing in
; both is drawn as its own id, so a gap shows instead of an empty row.
;
; FORMAT: the engine's own ini reader (`platform/options.cpp`) - one section
; per language, `id = text`. Two things that reader imposes on the TEXTS:
;   * a `;` or `#` ANYWHERE in a line starts a comment - no text may hold one;
;   * the ids are folded to lower case.
; The file is UTF-8; the loader converts each text to the fonts' 8-bit codes
; with `latin1()` (`ui/options.cpp`), which maps Latin-1 one to one - so no
; character outside Latin-1: a straight ' and never a curly one, "oe" and not
; the ligature. `%s` / `%d` are filled in by the code.
;
; The ids follow the plan's tables: `page.*` the headings, `row.*` a row's
; label, `<row>.<value>` a choice's caption, `msg.*` a line the menu or the
; switch key prints on screen.
; ---------------------------------------------------------------------------

